name: Auto Update HTTV Playlist

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Stream Updater
        run: |
          python update_streams.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "HTTV Bot"
          git config --global user.email "bot@httv.vn"
          git add playlist.m3u app/src/main/assets/httv_playlist.m3u
          if git diff --staged --quiet; then
            echo "No playlist changes to commit."
          else
            git commit -m "chore(playlist): auto-update fresh stream tokens [skip ci]"
            git push origin main
          fi
